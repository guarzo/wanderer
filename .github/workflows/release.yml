name: Zoo Build and Deploy

on:
  push:
    branches:
      - guarzo/release

# Default token is read-only. The tag-build-deploy job scopes itself up to
# contents: write because it pushes a tag; permissions cannot be set per step.
permissions:
  contents: read

# Two pushes in quick succession would otherwise race on the same deploy target.
concurrency:
  group: zoo-release
  cancel-in-progress: false

jobs:
  tag-build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Create a tag
        id: create_tag
        run: |
          TAG="v$(date +%Y%m%d%H%M%S)"
          echo "Creating new tag: $TAG"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag -a "$TAG" -m "Tag from GitHub Actions"
          git push origin "$TAG"

          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Extract version from created tag
        id: get_version
        run: |
          VERSION="${{ steps.create_tag.outputs.TAG }}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          push: true
          tags: |
            guarzo/mapper:latest
            guarzo/mapper:${{ steps.get_version.outputs.VERSION }}

      - name: Deploy to remote server
        uses: appleboy/ssh-action@b60142998894e495c513803efc6d5d72a72c968a  # v0.1.8
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            VERSION=${{ steps.get_version.outputs.VERSION }}

            echo "Deploying version $VERSION"

            cat <<EOF > /app/wanderer/.env
            WANDERER_VERSION=$VERSION
            EOF

            cd /app/wanderer
            ./compose-manager.sh upgrade
